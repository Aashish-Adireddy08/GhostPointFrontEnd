# Local webcam demo. All listeners and ICE candidates stay on this computer.
logLevel: info
rtsp: false
rtmp: false
hls: false
srt: false
moq: false
api: true
apiAddress: 127.0.0.1:9997
webrtc: true
webrtcAddress: 127.0.0.1:8889
webrtcLocalUDPAddress: 127.0.0.1:8189
webrtcLocalTCPAddress: 127.0.0.1:8189
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts: [127.0.0.1]
webrtcICEServers2: []
webrtcAllowOrigins:
  - http://127.0.0.1:5174
  - http://localhost:5174
authInternalUsers:
  - user: any
    ips: [127.0.0.1, '::1']
    permissions:
      - action: publish
      - action: read
      - action: api
paths:
  webcam:
    source: publisher
